<header class="app-topbar" th:fragment="header" xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary d-lg-none" type="button" id="sidebarToggle"
                aria-label="Toggle navigation">
            <i class="bi bi-list"></i>
        </button>
        <a class="app-brand" th:href="@{/dashboard}">
            <img class="app-logo" th:src="@{/images/ooredoologo.png}" alt="Ooredoo Logo">
            <span>CR Issue Tracker</span>
        </a>
    </div>
    <div class="d-flex align-items-center gap-2">
        <a class="btn btn-light position-relative" th:href="@{/notifications}" title="Notifications">
            <i class="bi bi-bell"></i>
            <span th:if="${unreadNotifications > 0}"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  th:text="${unreadNotifications}">0</span>
        </a>
        <form th:if="${isAdmin and !isImpersonating}" th:action="@{/admin/impersonate}" method="post"
              class="d-flex align-items-center gap-2 mb-0" style="min-width: 14rem;"
              data-confirm="Switch to the selected user? You can switch back from the banner.">
            <select class="form-select form-select-sm" name="username" required>
                <option value="">View as…</option>
                <option th:each="u : ${impersonateUsers}" th:value="${u.username}"
                        th:text="${u.displayLabel() + ' (' + u.username + ')'}"></option>
            </select>
            <button class="btn btn-light" type="submit" title="Impersonate user">
                <i class="bi bi-person-badge"></i>
            </button>
        </form>
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                <i class="bi bi-person-circle me-1"></i>
                <span th:text="${currentUser?.displayLabel()}">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><span class="dropdown-item-text text-muted" th:text="${currentUser?.username}">username</span></li>
            </ul>
        </div>
        <form th:if="${isImpersonating}" th:action="@{/impersonate/exit}" method="post" class="mb-0">
            <button class="btn btn-warning" type="submit" title="Switch back">
                <i class="bi bi-arrow-left-right me-1"></i>Switch back
            </button>
        </form>
        <form id="logoutForm" th:action="@{/logout}" method="post" class="mb-0" th:if="${!isImpersonating}">
            <button class="btn btn-light" type="submit" title="Logout">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
        </form>
    </div>
</header>
