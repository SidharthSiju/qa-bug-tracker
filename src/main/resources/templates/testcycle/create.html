<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>New Test Cycle</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-3">
        <a class="btn btn-sm btn-light" th:href="@{/change-requests/{id}(id=${cr.id})}">
            <i class="bi bi-arrow-left"></i> Back
        </a>
        <h2 class="mt-2 mb-0">New Test Cycle — <span th:text="${cr.crNumber}"></span></h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/test-cycles}" th:object="${cycleForm}" method="post" data-disable-on-submit>
                <input type="hidden" th:field="*{crId}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="name">Name</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}"
                               placeholder="e.g. Cycle 1">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="startDate">Start Date</label>
                        <input type="date" class="form-control" id="startDate" th:field="*{startDate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="endDate">End Date</label>
                        <input type="date" class="form-control" id="endDate" th:field="*{endDate}">
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Create Cycle</button>
                    <a class="btn btn-light" th:href="@{/change-requests/{id}(id=${cr.id})}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
