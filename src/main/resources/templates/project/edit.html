<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Edit Project</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-3">
        <a class="btn btn-sm btn-light" th:href="@{/admin/projects}"><i class="bi bi-arrow-left"></i> Back</a>
        <h2 class="mt-2 mb-0">Edit <span th:text="${project.projectCode}"></span></h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/admin/projects/{id}/edit(id=${project.id})}" th:object="${projectForm}" method="post"
                  data-disable-on-submit>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label required" for="projectCode">Project Code</label>
                        <input type="text" class="form-control" id="projectCode" th:field="*{projectCode}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label required" for="projectName">Project Name</label>
                        <input type="text" class="form-control" id="projectName" th:field="*{projectName}">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                            <label class="form-check-label" for="active">Active</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="description">Description</label>
                        <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save Changes</button>
                    <a class="btn btn-light" th:href="@{/admin/projects}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
