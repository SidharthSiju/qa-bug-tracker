<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Projects</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Projects</h2>
            <p class="text-muted mb-0">Manage projects</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/projects/new}"><i class="bi bi-plus-lg me-1"></i>New Project</a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/admin/projects}" th:object="${criteria}" method="get" class="row g-2">
                <div class="col-md-6">
                    <input type="text" class="form-control form-control-sm" th:field="*{search}"
                           placeholder="Code, name or description">
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm" th:field="*{active}">
                        <option value="">All statuses</option>
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary btn-sm w-100" type="submit"><i class="bi bi-search"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr><th data-sort="projectCode">Code</th><th data-sort="projectName">Name</th><th data-sort="description">Description</th><th data-sort="active">Active</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="project : ${page.content}">
                    <td th:text="${project.projectCode}"></td>
                    <td th:text="${project.projectName}"></td>
                    <td th:text="${project.description}"></td>
                    <td>
                        <span th:if="${project.active}" class="badge badge-soft sla-within">Active</span>
                        <span th:unless="${project.active}" class="badge badge-soft status-cancelled">Inactive</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/projects/{id}/edit(id=${project.id})}">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(page.content)}">
                    <td colspan="5" class="empty-state">No projects found</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end">
            <nav th:if="${page.totalPages > 1}" aria-label="Pagination">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/projects(page=${page.number - 1}, size=${page.size}, search=${criteria.search}, active=${criteria.active})}">Previous</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/projects(page=${page.number + 1}, size=${page.size}, search=${criteria.search}, active=${criteria.active})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</section>
</body>
</html>
