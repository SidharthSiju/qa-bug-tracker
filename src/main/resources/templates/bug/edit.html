<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Edit Bug</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-3">
        <a class="btn btn-sm btn-light" th:href="@{/bugs/{id}(id=${bug.id})}">
            <i class="bi bi-arrow-left"></i> Back
        </a>
        <h2 class="mt-2 mb-0">Edit <span th:text="${bug.bugNumber}"></span></h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/bugs/{id}/edit(id=${bug.id})}" th:object="${bugForm}" method="post"
                  data-disable-on-submit>
                <input type="hidden" th:field="*{version}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label required" for="crId">Change Request</label>
                        <select class="form-select" id="crId" th:field="*{crId}">
                            <option value="">Select CR</option>
                            <option th:each="cr : ${crs}" th:value="${cr.id}"
                                    th:text="${cr.crNumber + ' - ' + cr.crName}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="testCaseId">Test Case</label>
                        <select class="form-select" id="testCaseId" th:field="*{testCaseId}"
                                th:data-test-cases-url="@{/api/test-cases}">
                            <option value="">No test case</option>
                            <option th:each="testCase : ${testCases}" th:value="${testCase.id}"
                                    th:text="${testCase.testCaseNumber + ' - ' + testCase.title}"></option>
                        </select>
                        <div class="form-text">Lists the test cases of the selected change request.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label required" for="title">Title</label>
                        <input type="text" class="form-control" id="title" th:field="*{title}">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label required" for="severity">Severity</label>
                        <select class="form-select" id="severity" th:field="*{severity}">
                            <option th:each="severity : ${T(com.duc.crqa.common.enums.Severity).values()}"
                                    th:value="${severity}" th:text="${severity}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label required" for="priority">Priority</label>
                        <select class="form-select" id="priority" th:field="*{priority}">
                            <option th:each="priority : ${T(com.duc.crqa.common.enums.Priority).values()}"
                                    th:value="${priority}" th:text="${priority}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label required" for="environment">Environment</label>
                        <select class="form-select" id="environment" th:field="*{environment}">
                            <option value="">Select</option>
                            <option value="DEV">DEV</option>
                            <option value="SIT">SIT</option>
                            <option value="UAT">UAT</option>
                            <option value="STG">STG</option>
                            <option value="PROD">PROD</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="application">Application</label>
                        <input type="text" class="form-control" id="application" th:field="*{application}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="module">Module</label>
                        <input type="text" class="form-control" id="module" th:field="*{module}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="sprint">Sprint</label>
                        <input type="text" class="form-control" id="sprint" th:field="*{sprint}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="defectCategory">Defect Category</label>
                        <select class="form-select" id="defectCategory" th:field="*{defectCategory}">
                            <option value="">Unclassified</option>
                            <option th:each="category : ${T(com.duc.crqa.common.enums.DefectCategory).values()}"
                                    th:value="${category}" th:text="${category.label}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="testPhaseFound">Test Phase Found</label>
                        <select class="form-select" id="testPhaseFound" th:field="*{testPhaseFound}">
                            <option value="">Select</option>
                            <option th:each="phase : ${T(com.duc.crqa.common.enums.TestPhase).values()}"
                                    th:value="${phase}" th:text="${phase}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="externalDefectId">External Defect ID</label>
                        <input type="text" class="form-control" id="externalDefectId" th:field="*{externalDefectId}"
                               placeholder="Reference in an external tracker">
                    </div>
                    <div class="col-12">
                        <label class="form-label required" for="description">Description</label>
                        <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="stepsToReproduce">Steps to Reproduce</label>
                        <textarea class="form-control" id="stepsToReproduce" rows="3" th:field="*{stepsToReproduce}"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="expectedResult">Expected Result</label>
                        <textarea class="form-control" id="expectedResult" rows="3" th:field="*{expectedResult}"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="actualResult">Actual Result</label>
                        <textarea class="form-control" id="actualResult" rows="3" th:field="*{actualResult}"></textarea>
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save Changes</button>
                    <a class="btn btn-light" th:href="@{/bugs/{id}(id=${bug.id})}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
