<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-bs-theme=${appTheme == 'dark' ? 'dark' : 'light'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | CR Issue Tracker</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-body d-flex align-items-center justify-content-center" style="min-height:100vh;"
      th:classappend="'theme-' + ${appTheme} + ' font-' + ${appFont} + ' fontsize-' + ${appFontSize}">
<div class="card shadow-sm" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <img class="login-logo mx-auto d-block mb-2" th:src="@{/images/ooredoologo.png}" alt="Ooredoo Logo">
            <h1 class="h4 mb-1">CR Issue Tracker</h1>
            <p class="text-muted mb-0">Sign in to continue</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been signed out.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
