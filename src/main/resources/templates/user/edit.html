<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Edit User</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-3">
        <a class="btn btn-sm btn-light" th:href="@{/admin/users}"><i class="bi bi-arrow-left"></i> Back</a>
        <h2 class="mt-2 mb-0">Edit <span th:text="${user.username}"></span></h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${userForm}" method="post"
                  data-disable-on-submit>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label required" for="username">Username</label>
                        <input type="text" class="form-control" id="username" th:field="*{username}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label required" for="displayName">Display Name</label>
                        <input type="text" class="form-control" id="displayName" th:field="*{displayName}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="password">New Password (leave blank to keep)</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                            <label class="form-check-label" for="active">Active</label>
                        </div>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="emailNotifications"
                                   th:field="*{emailNotifications}">
                            <label class="form-check-label" for="emailNotifications">Email notifications</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Roles</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check" th:each="role : ${roles}">
                                <input class="form-check-input" type="checkbox" th:value="${role}"
                                       th:name="roles" th:id="'role-' + ${role}"
                                       th:checked="${userForm.roles.contains(role)}">
                                <label class="form-check-label" th:for="'role-' + ${role}" th:text="${role}"></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save Changes</button>
                    <a class="btn btn-light" th:href="@{/admin/users}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
