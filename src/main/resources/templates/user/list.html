<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Users</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Users</h2>
            <p class="text-muted mb-0">Manage users and roles</p>
        </div>
        <div class="d-flex gap-2" th:if="${canManageUsers}">
            <div class="btn-group">
                <a class="btn btn-outline-secondary" th:href="@{/admin/users/upload}">
                    <i class="bi bi-upload me-1"></i>Bulk Import
                </a>
                <a class="btn btn-outline-secondary" th:href="@{/admin/users/upload/template}"
                   title="Download sample CSV">
                    <i class="bi bi-info-circle"></i>
                </a>
            </div>
            <a class="btn btn-primary" th:href="@{/admin/users/new}"><i class="bi bi-plus-lg me-1"></i>New User</a>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/admin/users}" th:object="${criteria}" method="get" class="row g-2">
                <div class="col-md-5">
                    <input type="text" class="form-control form-control-sm" th:field="*{search}"
                           placeholder="Username, name or email">
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm" th:field="*{role}">
                        <option value="">All roles</option>
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm" th:field="*{active}">
                        <option value="">All statuses</option>
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary btn-sm w-100" type="submit"><i class="bi bi-search"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr><th data-sort="username">Username</th><th data-sort="displayName">Display Name</th><th data-sort="email">Email</th><th>Roles</th><th data-sort="active">Active</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="user : ${page.content}">
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.displayName}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <span class="badge badge-soft status-verified" th:each="role : ${user.roles}" th:text="${role}"></span>
                    </td>
                    <td>
                        <span th:if="${user.active}" class="badge badge-soft sla-within">Active</span>
                        <span th:unless="${user.active}" class="badge badge-soft status-cancelled">Inactive</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:if="${canManageUsers}"
                           th:href="@{/admin/users/{id}/edit(id=${user.id})}">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(page.content)}">
                    <td colspan="6" class="empty-state">No users found</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end">
            <nav th:if="${page.totalPages > 1}" aria-label="Pagination">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/users(page=${page.number - 1}, size=${page.size}, search=${criteria.search}, role=${criteria.role}, active=${criteria.active})}">Previous</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/users(page=${page.number + 1}, size=${page.size}, search=${criteria.search}, role=${criteria.role}, active=${criteria.active})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</section>
</body>
</html>
